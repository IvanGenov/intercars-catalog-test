<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <title>Интеркарс — Автомобили и части (тест)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
:root{
  --brand-red:#d61d35;
  --brand-red-dark:#b9182d;
  --brand-navy:#2f4157;
  --brand-navy-deep:#24364b;
  --bg:#f4f6f8;
  --panel:#ffffff;
  --line:#dde3ea;
  --text:#18222d;
  --muted:#667585;
  --soft-navy:#eef2f6;
  --soft-red:#fbebee;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  font-synthesis:none
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(214,29,53,.35);outline-offset:2px}
.shell{max-width:1120px;margin:0 auto;padding:0 18px 28px}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 20px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.brandmark{display:block;flex:0 0 56px;width:56px;height:56px;object-fit:cover;border-radius:10px;box-shadow:0 6px 16px rgba(30,42,60,.11)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--brand-red);text-transform:uppercase}
.top h1{margin:2px 0 0;font-size:22px;color:var(--brand-navy);line-height:1.15}
.demo{margin-left:auto;color:var(--brand-navy);background:var(--soft-navy);border:1px solid #d9e0e7;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700}
.controls,.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(28,40,55,.05)}
.controls{padding:15px}
.search-label{display:block;font-size:12px;font-weight:800;margin-bottom:8px;color:var(--brand-navy)}
.controls input{width:100%;background:#fff;border:1px solid #d4dbe3;border-radius:11px;padding:12px 14px;min-width:0}
.controls input::placeholder{color:#8391a0}
.control-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px}
.segments{display:flex;gap:6px;background:var(--soft-navy);border-radius:11px;padding:4px}
.segment{border:0;border-radius:8px;background:transparent;padding:8px 14px;color:#556271;font-size:13px;font-weight:700}
.segment.selected{background:var(--brand-red);color:#fff}
.control-row select{background:#fff;border:1px solid #d4dbe3;border-radius:11px;padding:10px;max-width:210px;color:var(--text)}
.status{color:var(--muted);font-size:13px;margin:18px 1px 12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{display:flex;gap:13px;background:var(--panel);border:1px solid var(--line);text-align:left;border-radius:16px;padding:12px;width:100%;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:#bfc9d4;box-shadow:0 10px 26px rgba(37,54,75,.08);transform:translateY(-1px)}
.cover{width:140px;min-width:140px;aspect-ratio:4/3;border-radius:11px;background:linear-gradient(135deg,#f4f7fa,#e3e9f0);display:grid;place-items:center;color:#8896a5;font-size:12px;text-align:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;flex:1}
.meta{font-size:11px;color:#758392;margin:1px 0 5px;font-weight:600}
.vehicle-title{font-size:16px;font-weight:800;line-height:1.2;margin:0 0 7px;color:var(--brand-navy)}
.vehicle-sub{font-size:12px;color:#667585;line-height:1.45;margin:0 0 12px}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--soft-navy);color:var(--brand-navy);border-radius:7px;font-size:11px;font-weight:800;padding:5px 8px}
.pill.parts{background:var(--soft-navy);color:var(--brand-navy)}
.pill.sold{background:#efe8ea;color:#7d4a53}
.price{font-size:15px;font-weight:900;color:var(--brand-navy-deep)}
.muted{font-size:12px;color:var(--muted)}
.detail{margin-top:20px}
.back{background:transparent;border:0;color:var(--brand-red);font-weight:800;padding:9px 0 18px}
.detail-panel{padding:18px}
.detail-header{display:flex;justify-content:space-between;gap:14px;align-items:start}
.detail-title{margin:0 0 6px;font-size:26px;color:var(--brand-navy)}
.detail-section{border-top:1px solid #e8edf2;margin-top:20px;padding-top:17px}
.detail-section h3{font-size:17px;margin:0 0 12px;color:var(--brand-navy)}
.details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.details-grid div{background:#f7f9fc;border-radius:10px;padding:12px;border:1px solid #edf1f5}
.details-grid dt{color:#6b7988;font-size:11px}
.details-grid dd{margin:5px 0 0;font-size:14px;font-weight:800}
.note{line-height:1.6;color:#455565;white-space:pre-wrap}
.part{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ecf0f4}
.part strong{display:block;font-size:14px}.part small{display:block;color:#667585;margin-top:4px}
.photo-strip{display:flex;gap:10px;overflow:auto}.photo-strip img{width:180px;height:130px;object-fit:cover;border-radius:9px}.placeholder{background:#f2f5f8;border-radius:11px;padding:34px;text-align:center;color:#7b8896}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:770px){.cards{grid-template-columns:1fr}.demo{font-size:10px}.cover{width:115px;min-width:115px}.control-row{flex-wrap:wrap}.control-row select{width:100%;max-width:none}.details-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.card{gap:10px}.cover{width:93px;min-width:93px}.vehicle-title{font-size:14px}.price{font-size:13px}.segment{padding:8px 11px}.detail-title{font-size:21px}.details-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>

      <div><div class="eyebrow">INTERCARS · ПУБЛИЧЕН КАТАЛОГ</div><h1>Автомобили и части</h1></div>
      <div class="demo">Демонстрационни данни</div>
    </header>
    <main>
      <section id="catalogView" aria-label="Каталог">
        <div class="controls">
          <label class="search-label" for="search">Търсене</label>
          <input id="search" type="search" placeholder="Марка, модел, част…" autocomplete="off" />
          <div class="control-row">
            <div class="segments" role="group" aria-label="Вид продажба">
              <button type="button" class="segment selected" data-mode="all" aria-pressed="true">Всички</button>
              <button type="button" class="segment" data-mode="whole" aria-pressed="false">Цели</button>
              <button type="button" class="segment" data-mode="parts" aria-pressed="false">За части</button>
            </div>
            <label for="location" class="sr-only">Филтър по обект</label><select id="location"><option value="">Всички обекти</option></select>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Зареждане…</p>
        <div id="results" class="cards" aria-label="Автомобили"></div>
      </section>
      <section id="detailView" class="detail" aria-label="Детайли за автомобил" hidden>
        <button type="button" id="back" class="back">← Към каталога</button>
        <div id="detailContent"></div>
      </section>
    </main>
  </div>
  <script>
(function () {
  'use strict';
  var data = {revision:'', vehicles:[], parts:[], photos:[]};
  var selectedMode = 'all';
  var els = {
    catalog: document.getElementById('catalogView'), detail: document.getElementById('detailView'),
    search: document.getElementById('search'), location: document.getElementById('location'),
    results: document.getElementById('results'), status: document.getElementById('status'),
    content: document.getElementById('detailContent')
  };
  var money = new Intl.NumberFormat('bg-BG', {style:'currency', currency:'EUR'});
  function node(tag, className, value) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (value !== undefined && value !== null) el.textContent = String(value);
    return el;
  }
  function price(value) { return value === null ? 'По запитване' : money.format(value); }
  function saleLabel(mode) { return mode === 'parts' ? 'За части' : 'Цял автомобил'; }
  function statusLabel(status) {
    return ({active:'Активен',reserved:'Резервиран',sold:'Продаден',
      available:'Налична',unavailable:'Не е налична'})[status] || 'По запитване';
  }
  function partsFor(id) { return data.parts.filter(function (part) { return part.vehicle_id === id; }); }
  function photosFor(id) {
    return data.photos.filter(function (photo) { return photo.vehicle_id === id; })
      .sort(function (a,b) { return Number(b.is_cover)-Number(a.is_cover) || a.sort_order-b.sort_order; });
  }
  function matchVehicle(v, query) {
    if (!query) return true;
    var parts = partsFor(v.id).map(function (p) { return p.name_text + ' ' + p.notes_public; }).join(' ');
    var searchable = [v.code,v.make,v.model,v.year,v.location_name,v.engine,v.gearbox,
      v.condition_text,parts].join(' ').toLocaleLowerCase('bg-BG');
    return searchable.indexOf(query) >= 0;
  }
  function attachCover(parent, id) {
    var cover = node('div','cover');
    var first = photosFor(id)[0];
    if (first) {
      var img = node('img'); img.alt = 'Снимка на автомобила';
      img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.onerror = function () { img.remove(); cover.appendChild(node('span','', 'Няма снимка')); };
      img.src = first.url; cover.appendChild(img);
    } else cover.appendChild(node('span','', 'Няма снимка'));
    parent.appendChild(cover);
  }
  function renderCard(v) {
    var card = node('button','card'); card.type = 'button';
    attachCover(card, v.id);
    var body = node('div','card-body');
    body.appendChild(node('div','meta', v.code + ' · ' + (v.location_name || 'Неуточнен обект')));
    body.appendChild(node('h3','vehicle-title', v.make + ' ' + v.model + (v.year ? ' · ' + v.year : '')));
    body.appendChild(node('p','vehicle-sub', (v.engine || 'Двигател по запитване') + (v.gearbox ? ' · ' + v.gearbox : '')));
    var bottom = node('div','bottom');
    bottom.appendChild(node('span','pill ' + (v.sale_mode==='parts' ? 'parts':'') + (v.status==='sold'?' sold':''),saleLabel(v.sale_mode)+' · '+statusLabel(v.status)));
    bottom.appendChild(node('strong','price', v.sale_mode === 'whole' ? price(v.asking_price_eur) : 'Части по запитване'));
    body.appendChild(bottom); card.appendChild(body);
    card.setAttribute('aria-label','Отвори ' + v.make + ' ' + v.model);
    card.addEventListener('click',function(){ location.hash='vehicle/'+encodeURIComponent(v.id); });
    return card;
  }
  function renderList() {
    var query = els.search.value.trim().toLocaleLowerCase('bg-BG');
    var locationName = els.location.value;
    var visible = data.vehicles.filter(function (v) {
      return (selectedMode==='all' || v.sale_mode===selectedMode) &&
        (!locationName || v.location_name===locationName) && matchVehicle(v,query);
    });
    els.results.replaceChildren();
    visible.forEach(function(v){ els.results.appendChild(renderCard(v)); });
    els.status.textContent = visible.length ? visible.length + ' автомобила · примерен каталог' : 'Няма резултати. Опитайте друго търсене или филтър.';
  }
  function addFact(dl,label,value) {
    var wrapper = node('div'); wrapper.appendChild(node('dt','',label));
    wrapper.appendChild(node('dd','',value || 'По запитване')); dl.appendChild(wrapper);
  }
  function renderDetail(id) {
    var v = data.vehicles.find(function(v){ return v.id===id; });
    if (!v) { location.hash=''; return; }
    els.catalog.hidden = true; els.detail.hidden = false;
    els.content.replaceChildren();
    var panel = node('article','detail-panel'); var header = node('div','detail-header');
    var leading = node('div'); leading.appendChild(node('div','meta',v.code+' · '+v.location_name));
    leading.appendChild(node('h2','detail-title',v.make+' '+v.model+(v.year ? ' · '+v.year : '')));
    leading.appendChild(node('span','pill '+(v.sale_mode==='parts'?'parts':''),saleLabel(v.sale_mode)+' · '+statusLabel(v.status)));
    header.appendChild(leading);
    if (v.sale_mode==='whole') header.appendChild(node('strong','price',price(v.asking_price_eur)));
    panel.appendChild(header);
    var photoSection = node('section','detail-section');photoSection.appendChild(node('h3','','Снимки'));
    var pictures = photosFor(v.id);
    if (!pictures.length) photoSection.appendChild(node('div','placeholder','Все още няма снимки'));
    else { var strip = node('div','photo-strip'); pictures.forEach(function(p){
      var im=node('img');im.src=p.url;im.alt='Снимка на '+v.make+' '+v.model;
      im.loading='lazy';im.referrerPolicy='no-referrer';
      im.onerror=function(){ im.replaceWith(node('div','placeholder','Снимката не е достъпна')); };
      strip.appendChild(im);
    });photoSection.appendChild(strip); }
    panel.appendChild(photoSection);
    var facts = node('section','detail-section');facts.appendChild(node('h3','','Характеристики'));
    var dl=node('dl','details-grid');addFact(dl,'Година',v.year);addFact(dl,'Двигател',v.engine);
    addFact(dl,'Скоростна кутия',v.gearbox);addFact(dl,'Обект',v.location_name);
    addFact(dl,'Статус',statusLabel(v.status));addFact(dl,'Продажба',saleLabel(v.sale_mode));
    facts.appendChild(dl);panel.appendChild(facts);
    if (v.condition_text) {var condition=node('section','detail-section');condition.appendChild(node('h3','','Състояние'));
      condition.appendChild(node('p','note',v.condition_text));panel.appendChild(condition);}
    if (v.sale_mode==='parts') {
      var section=node('section','detail-section');section.appendChild(node('h3','','Описани части'));
      var parts=partsFor(v.id);
      
      parts.forEach(function(p){var row=node('div','part');var left=node('div');left.appendChild(node('strong','',p.name_text));
        left.appendChild(node('small','',statusLabel(p.status)+(p.notes_public?' · '+p.notes_public:'')));
        var label = (p.status==='available' || p.status==='reserved') ? price(p.asking_price_eur) : statusLabel(p.status);
        row.appendChild(left);row.appendChild(node('strong','',label));section.appendChild(row);});
      section.appendChild(node('p','muted','Други части — по запитване.'));
      panel.appendChild(section);
    }
    els.content.appendChild(panel);
    window.scrollTo(0,0);
  }
  function route() {
    var hash=location.hash.slice(1);
    if (hash.indexOf('vehicle/')===0) {
      try {renderDetail(decodeURIComponent(hash.slice(8)));}catch(e){location.hash='';}
      return;
    }
    els.detail.hidden=true;els.catalog.hidden=false;
  }
  document.getElementById('back').addEventListener('click',function(){location.hash='';});
  els.search.addEventListener('input',renderList);
  els.location.addEventListener('change',renderList);
  document.querySelectorAll('[data-mode]').forEach(function(button){button.addEventListener('click',function(){
    selectedMode=button.getAttribute('data-mode');
    document.querySelectorAll('[data-mode]').forEach(function(b){var selected=b===button;
      b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected?'true':'false');});
    renderList();
  });});
  window.addEventListener('hashchange',route);
  // The API endpoint is an independent public-only Apps Script deployment.
  // The callback is fixed server-side; no user-controlled JSONP callback names.
  var apiUrl = 'https://script.google.com/macros/s/AKfycbxjkmPqyIEj-2B24HUDJuKqhrfhs51eHvHyOb8AXtjVYnQSqk0pAZqpv7hwoyf2HmL8XA/exec';
  var arrived = false;
  window.__intercarsDataReady = function(snapshot) {
    arrived = true;
    if (!snapshot || snapshot.error || !Array.isArray(snapshot.vehicles) ||
        !Array.isArray(snapshot.parts) || !Array.isArray(snapshot.photos)) {
      els.status.textContent='Каталогът временно не е достъпен.';
      return;
    }
    data = snapshot;
    var locations = Array.from(new Set(data.vehicles.map(function(v){return v.location_name;}).filter(Boolean))).sort();
    locations.forEach(function(name) {var option=node('option','',name); option.value=name; els.location.appendChild(option);});
    renderList();route();
  };
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(apiUrl)) {
    els.status.textContent='Тестовата връзка към данните още не е настроена.';
    return;
  }
  var tag = node('script');
  tag.async = true;
  tag.src = apiUrl;
  tag.onerror = function() { if (!arrived) els.status.textContent='Временно не можем да заредим каталога.'; };
  document.head.appendChild(tag);
  setTimeout(function(){if(!arrived) els.status.textContent='Каталогът не отговори. Опитайте отново.';}, 15000);
})();
</script>
